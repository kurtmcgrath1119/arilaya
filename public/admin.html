<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AriLaya Admin</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css">
</head><body>
<header><h1>AriLaya Admin</h1><span><a href="index.html">View site</a> <button id="logout" class="hidden">Log out</button></span></header>

<form id="login" class="login">
  <h3 style="margin-top:0">Admin login</h3>
  <label>Username</label><input id="l-user" autocomplete="username" required>
  <label>Password</label><input id="l-pass" type="password" autocomplete="current-password" required>
  <div class="row"><button class="pri">Log in</button></div><div id="l-msg"></div>
</form>

<div id="app" class="layout hidden">
  <aside class="side">
    <h3 style="margin-top:0" id="form-title">Add a lot</h3>
    <p class="mu">Click the map to mark each corner of the lot. Drag the yellow dots to adjust.</p>
    <div class="row"><button type="button" id="undo">Undo point</button><button type="button" id="clear">Clear boundary</button></div>
    <p id="area" class="mu"></p>
    <label>Title</label><input id="a-title">
    <div class="two">
      <div><label>Barangay</label><select id="a-barangay"></select></div>
      <div><label>Land type</label><select id="a-land_type"></select></div>
      <div><label>Price (₱)</label><input id="a-price" type="number" min="0"></div>
      <div><label>Status</label><select id="a-status"></select></div>
    </div>
    <label>Address / street</label><input id="a-address">
    <div class="two">
      <div><label>Nearest road</label><input id="a-nearest_road"></div>
      <div><label>Nearest landmark</label><input id="a-landmark"></div>
      <div><label>Seller name</label><input id="a-seller_name"></div>
      <div><label>Seller phone</label><input id="a-seller_phone"></div>
    </div>
    <label>Description</label><textarea id="a-description" rows="3"></textarea>
    <div class="row"><button type="button" id="save" class="pri">Save lot</button><button type="button" id="new">New / cancel edit</button></div>
    <div id="msg"></div>

    <h3>All lots</h3>
    <table id="tbl"></table>

    <h3>Evaluation feedback</h3>
    <div id="fbsum" class="mu">Loading…</div>
  </aside>
  <div id="map"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="common.js"></script>
<script src="admin.js"></script>
</body></html>
